name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Only keep the latest run per branch/PR; cancel superseded in-progress runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Credentials reached this repo once already. Two checks guard the tree: one
  # for credential files, one for secret-shaped strings anywhere else.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4

      # .gitignore is not honoured for a file git already tracks, so a credential
      # committed once stays committed and every ignore rule added afterwards is
      # silently inert — which is exactly how backend/.env survived for the life
      # of the repo. Tracking is the thing to assert on, not the ignore file.
      - name: No credential file may be tracked
        run: |
          tracked=$(git ls-files \
            | grep -E '(^|/)\.env$|(^|/)\.env\.[^/]*$|(^|/)env\.properties$|(^|/)secrets/' \
            | grep -vE '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Credential files are tracked by git:"
            echo "$tracked"
            echo "Untrack with 'git rm --cached <file>', then rotate the credential:"
            echo "removing it from the tip does not remove it from history."
            exit 1
          fi
          echo "No credential files tracked."

      # Installed from the release tarball rather than the marketplace action,
      # which asks organisations for a licence key.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # The checkout only, not the history: the credentials already in past
      # commits were rotated rather than rewritten, so scanning every commit
      # would fail on every run and this job would end up switched off.
      # --redact keeps anything it finds out of the public build log.
      - name: Scan the tree for secrets
        run: gitleaks dir . --no-banner --redact --config .gitleaks.toml

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pingan_mobile_app
          POSTGRES_USER: pingan_mobile_app_user
          POSTGRES_PASSWORD: PinganMobileApp@2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pingan_mobile_app_user -d pingan_mobile_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/pingan_mobile_app
      DB_USER: pingan_mobile_app_user
      DB_PASSWORD: PinganMobileApp@2026
      IP_ADDR: 0.0.0.0
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: localhost
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      ENABLE_LIBRE_TRANSLATE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Maven tests
        run: ./mvnw -B test

  frontend-web-export:
    name: Frontend web export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      BACKEND_BASE_URL: http://127.0.0.1:8080
      IP_ADDR: 127.0.0.1
      ENABLE_LIBRE_TRANSLATE: "false"
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Check locale parity
        run: node scripts/check-locales.js

      - name: Export Expo web build
        run: npx expo export --platform web --output-dir dist

  backend-image-build:
    name: Backend Docker build + smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pingan_mobile_app
          POSTGRES_USER: pingan_mobile_app_user
          POSTGRES_PASSWORD: PinganMobileApp@2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pingan_mobile_app_user -d pingan_mobile_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: pingan-mobile-app-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the freshly-built image against the live services and confirm it
      # actually starts and serves traffic — the build alone never runs it.
      - name: Start backend container
        run: |
          docker run -d --name pingan-smoke --network host \
            -e DB_URL=jdbc:postgresql://localhost:5432/pingan_mobile_app \
            -e DB_USER=pingan_mobile_app_user \
            -e DB_PASSWORD=PinganMobileApp@2026 \
            -e IP_ADDR=0.0.0.0 \
            -e SPRING_DATA_REDIS_HOST=localhost \
            -e SPRING_DATA_REDIS_PORT=6379 \
            -e SPRING_RABBITMQ_HOST=localhost \
            -e SPRING_RABBITMQ_PORT=5672 \
            -e SPRING_RABBITMQ_USERNAME=guest \
            -e SPRING_RABBITMQ_PASSWORD=guest \
            -e ENABLE_LIBRE_TRANSLATE=false \
            pingan-mobile-app-backend:ci

      - name: Wait for /actuator/health to report UP
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "✓ Backend is healthy"; exit 0
            fi
            sleep 3
          done
          echo "✗ Backend did not become healthy in time"; exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker logs pingan-smoke || true

      - name: Stop backend container
        if: always()
        run: docker rm -f pingan-smoke || true
