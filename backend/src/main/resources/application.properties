# Import external env.properties file
spring.config.import=optional:file:env.properties

# Use variables from env.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Flyway, baselined over the existing ddl-auto-managed schema: a non-empty schema
# is stamped at baseline version 1 (V1 itself is skipped there), so FUTURE schema
# changes go in db/migration as V2+ instead of relying on ddl-auto, which never
# alters or narrows an existing column (see DatabaseIntegrityMigration.widenToText
# for the incident that proved it). ddl-auto stays on until V-scripts cover parity.
spring.flyway.baseline-on-migrate=true

server.address=${IP_ADDR:0.0.0.0}

# Trust X-Forwarded-* headers from the production reverse proxy when generating
# absolute URLs. MEDIA_PUBLIC_BASE_URL still takes precedence for /media links.
server.forward-headers-strategy=framework

# The /media gateway streams OSS objects asynchronously (StreamingResponseBody);
# allow up to 10 minutes so large files survive slow mobile links.
spring.mvc.async.request-timeout=600000

# Push notification text bundle (messages*.properties). Chinese lives in the
# files as real characters, and an unknown locale must fall back to the English
# default bundle rather than to whatever locale the server host happens to run.
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Event registration reminders (EventReminderJob): registrants are pushed once,
# this many minutes before the event starts. The job polls every poll-ms, so a
# reminder lands between lead-minutes and lead-minutes minus one poll early.
events.reminder.lead-minutes=${EVENT_REMINDER_LEAD_MINUTES:60}
events.reminder.poll-ms=300000

# Actuator: expose a public health probe (used by deploys + the CI image smoke test).
# The mail indicator is disabled so health doesn't depend on reaching SMTP.
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

spring.data.redis.host=redis-fyp
spring.redis.port=6379

# Email for password reset — credentials live in env.properties (gitignored).
# Empty defaults keep the context bootable when the vars are absent (e.g. CI);
# real values are injected in production.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# === IN-APP ASSISTANT (ShalomBot / 平安小助手) ===
# Provider credentials live in infra/.env (gitignored) and reach the container as
# environment variables. Empty defaults keep the context bootable without them —
# AssistantProperties.isConfigured() is then false and the assistant never answers,
# which is what CI and a credential-less local run get.
#
# This switch only says the feature exists. Nothing is answered until an admin
# turns the assistant on for a specific group, which defaults to off.
assistant.enabled=${ASSISTANT_ENABLED:true}
assistant.base-url=${LLM_BASE_URL:}
assistant.api-key=${LLM_API_KEY:}
assistant.model=${LLM_MODEL:}
assistant.timeout-seconds=30
# Context is anchored at the message that summoned the assistant, not the newest
# messages at the time the worker runs — see docs/assistant-integration-plan.md §3.
assistant.max-context-messages=10
# Photos in the context are fetched from OSS by the server and inlined as base64
# data URLs — the model never sees a storage URL. Set LLM_IMAGE_INPUT=false for a
# model without image input; photos then become "[photo]" placeholders as before.
# Each photo message is one picture; the cap counts the newest photos in the window.
assistant.image-input=${LLM_IMAGE_INPUT:true}
assistant.max-images-per-request=${LLM_MAX_IMAGES:4}
assistant.max-image-bytes=5242880
# auto | low | high — low is a flat cheap cost but a 512px downscale that cannot
# read a poster.
assistant.image-detail=${LLM_IMAGE_DETAIL:auto}
# On a reasoning model this budget also covers the invisible reasoning, so a small
# value gets spent thinking and returns nothing. It is a ceiling, not a target.
assistant.max-output-tokens=${LLM_MAX_OUTPUT_TOKENS:2000}
# max_tokens | max_completion_tokens | auto. OpenAI's newer models require the
# second; most other compatible providers accept only the first. "auto" learns it
# from the provider's first rejection — pin it to skip that one wasted call.
assistant.max-tokens-parameter=${LLM_MAX_TOKENS_PARAM:auto}
# reasoning_effort to send, or auto | off. Normally omitted; gpt-5.x refuses to run
# function tools while reasoning on /v1/chat/completions and wants 'none', so "auto"
# adds it the first time a provider says so.
assistant.reasoning-effort=${LLM_REASONING_EFFORT:auto}
assistant.max-tool-rounds=4
assistant.max-tool-calls-per-round=3
assistant.max-tool-result-chars=4000
assistant.per-user-hourly-limit=5
assistant.per-conversation-daily-limit=200

# === RABBITMQ CONFIG ===
spring.rabbitmq.host=rabbitmq-fyp
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Android app update metadata. The frontend compares native Android versionCode
# with these values and opens the channel-specific URL when an update is needed.
#
# latest-* is the release that has been built and submitted (written by
# `npm run update`); published-* is the one the channel can actually install
# right now (written by `npm run live <channel>`). While published-* trails
# latest-*, clients are told about published-* and nothing is prompted — that
# gap is the store review window, during which the listing still serves the old
# build. min-supported is clamped to published so a force-update can never lock
# users behind a store that has not got the release yet.
app.update.android.direct.latest-version-name=1.2.0
app.update.android.direct.latest-version-code=10200
app.update.android.direct.published-version-name=1.0.3
app.update.android.direct.published-version-code=10003
app.update.android.direct.min-supported-version-code=10000
app.update.android.direct.force-update=false
app.update.android.direct.download-page-url=https://drive.google.com/drive/folders/1wRaLApfkwcO_5jkPUSsiPo0dwRr-pSpO?usp=sharing
app.update.android.direct.download-page-url-cn=https://pingan-app.lanzoup.com/b01d71pbfa?pwd=518c
app.update.android.direct.download-password-cn=518c
app.update.android.direct.release-notes.en=Multiple functions provided in chat feature. Various Bug fixes
