# Import external env.properties file
spring.config.import=optional:file:env.properties

# Use variables from env.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

server.address=${IP_ADDR}

spring.data.redis.host=redis-fyp
spring.redis.port=6379

# Email for password reset — credentials live in env.properties (gitignored).
# Empty defaults keep the context bootable when the vars are absent (e.g. CI);
# real values are injected in production.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# === RABBITMQ CONFIG ===
spring.rabbitmq.host=rabbitmq-fyp
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest