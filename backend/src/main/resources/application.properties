# Import external env.properties file
spring.config.import=optional:file:env.properties

# Use variables from env.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

server.address=${IP_ADDR:0.0.0.0}

# Trust X-Forwarded-* headers from the production reverse proxy when generating
# absolute URLs. MEDIA_PUBLIC_BASE_URL still takes precedence for /media links.
server.forward-headers-strategy=framework

# The /media gateway streams OSS objects asynchronously (StreamingResponseBody);
# allow up to 10 minutes so large files survive slow mobile links.
spring.mvc.async.request-timeout=600000

# Push notification text bundle (messages*.properties). Chinese lives in the
# files as real characters, and an unknown locale must fall back to the English
# default bundle rather than to whatever locale the server host happens to run.
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Actuator: expose a public health probe (used by deploys + the CI image smoke test).
# The mail indicator is disabled so health doesn't depend on reaching SMTP.
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

spring.data.redis.host=redis-fyp
spring.redis.port=6379

# Email for password reset — credentials live in env.properties (gitignored).
# Empty defaults keep the context bootable when the vars are absent (e.g. CI);
# real values are injected in production.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# === RABBITMQ CONFIG ===
spring.rabbitmq.host=rabbitmq-fyp
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Android app update metadata. The frontend compares native Android versionCode
# with these values and opens the channel-specific URL when an update is needed.
#
# latest-* is the release that has been built and submitted (written by
# `npm run update`); published-* is the one the channel can actually install
# right now (written by `npm run live <channel>`). While published-* trails
# latest-*, clients are told about published-* and nothing is prompted — that
# gap is the store review window, during which the listing still serves the old
# build. min-supported is clamped to published so a force-update can never lock
# users behind a store that has not got the release yet.
app.update.android.direct.latest-version-name=1.1.0
app.update.android.direct.latest-version-code=10100
app.update.android.direct.published-version-name=1.0.3
app.update.android.direct.published-version-code=10003
app.update.android.direct.min-supported-version-code=10000
app.update.android.direct.force-update=false
app.update.android.direct.download-page-url=https://drive.google.com/drive/folders/1wRaLApfkwcO_5jkPUSsiPo0dwRr-pSpO?usp=sharing
app.update.android.direct.download-page-url-cn=https://pingan-app.lanzoup.com/b01d71pbfa?pwd=518c
app.update.android.direct.download-password-cn=518c
