# Server-composed push notification text.
#
# These strings are written by the backend and shown by the OS, so the app never
# gets a chance to translate them — they are resolved per recipient from the
# language their device last reported (User.language), defaulting to English.
#
# Values go through java.text.MessageFormat: {0} is a placeholder and a literal
# apostrophe must be doubled ('').
#
# This default bundle is English; messages_zh.properties carries the Chinese.

push.chat.newMessage=New message
push.chat.mentionedYou=📣 {0} mentioned you
push.chat.repliedToYou=↩️ {0} replied to you
push.chat.photo=🖼️ Photo
push.chat.voice=🎤 Voice message
push.chat.event=📅 Event: {0}
push.chat.notice=📌 Group notice
push.chat.sticker=[Sticker] {0}

push.event.reminder.title=Event starting soon
push.event.reminder.body="{0}" starts at {1} — {2}
push.event.reminder.body.noLocation="{0}" starts at {1}

push.thread.newReply.body={0} replied: {1}

push.admin.newMember.title=New member
push.admin.newMember.body={0} just joined and is waiting to be verified.

push.learning.enrolled.title=Enrolled
push.learning.enrolled.body=You''re enrolled in "{0}". Time to start learning!

push.learning.courseCompleted.title=Course completed
push.learning.courseCompleted.body=Congratulations! You completed "{0}" and earned a certificate.

push.learning.quizPassed.title=Quiz passed
push.learning.quizPassed.body=You scored {0}% on "{1}". Well done!

push.learning.answersToReview.title=Answers to review
push.learning.answersToReview.body=A learner submitted "{0}" — short answers are awaiting your review.

push.learning.quizGraded.title=Quiz graded
push.learning.quizGraded.body.passed=Your answers for "{0}" were reviewed. Score: {1}% — passed!
push.learning.quizGraded.body.failed=Your answers for "{0}" were reviewed. Score: {1}%.

push.learning.achievement.title=Achievement unlocked
push.learning.achievement.body=You earned the "{0}" badge!

push.learning.goalReached.title=Goal reached
push.learning.goalReached.body=You completed your goal: "{0}".
